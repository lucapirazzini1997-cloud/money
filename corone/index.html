<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12171d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icona.svg">
<!--INIZIO-->
<title>Corone e Confini</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;600;700&family=IM+Fell+English+SC&display=swap">
<link rel="stylesheet" href="stile.css">
</head>
<body>
<div id="app" class="choosing">
  <canvas id="map" aria-label="Mappa del continente"></canvas>

  <header id="top">
    <div class="trow">
      <div id="tNation"></div>
      <div id="tDate"></div>
      <div class="speeds" role="group" aria-label="Velocità">
        <button data-speed="0" aria-label="Pausa">❚❚</button>
        <button data-speed="1" aria-label="Lento">▶</button>
        <button data-speed="2" aria-label="Normale">▶▶</button>
        <button data-speed="3" aria-label="Veloce">▶▶▶</button>
      </div>
    </div>
    <div class="res">
      <span><i>Oro</i><b id="rGold"></b></span>
      <span><i>Uomini</i><b id="rMp"></b></span>
      <span><i>Punti</i><b id="rPts"></b></span>
      <span><i>Reggimenti</i><b id="rArmy"></b></span>
    </div>
  </header>

  <div id="toasts" aria-live="polite"></div>

  <nav id="bar">
    <button id="bHome"><svg viewBox="0 0 24 24"><path d="M4 20V10l8-6 8 6v10h-5v-6H9v6z"/></svg>Capitale</button>
    <button id="bDip"><svg viewBox="0 0 24 24"><path d="M3 12l4-4 5 2 5-2 4 4-5 5-3-2-3 2z"/><path d="M8 13l3 3"/></svg>Diplomazia</button>
    <button id="bWars"><svg viewBox="0 0 24 24"><path d="M5 19L17 7V4h3v3L8 19"/><path d="M19 19L7 7V4H4v3l12 12"/></svg>Guerre<span id="bWarsN"></span></button>
    <button id="bMode"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span id="bModeL">Politica</span></button>
    <button id="bRank"><svg viewBox="0 0 24 24"><path d="M5 20V12h4v8M10 20V6h4v14M15 20v-10h4v10"/></svg>Classifica</button>
    <button id="bMenu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>Menu</button>
  </nav>

  <section id="sheet" hidden><div id="sheetBody"></div></section>

  <section id="start" hidden>
    <h1>Corone e Confini</h1>
    <p class="sub">Anno 1420. Nove regni si spartiscono un continente nuovo a ogni partita. Scegli il tuo.</p>
    <div id="nations"></div>
    <div class="startActs">
      <button class="b" id="bReroll">Nuovo continente</button>
      <button class="b" id="bContinue" hidden>Continua la partita</button>
      <button class="b pri" id="bPlay" disabled>Scegli una nazione</button>
    </div>
  </section>

  <div id="modal" hidden><div id="modalBox" role="dialog" aria-modal="true"></div></div>
</div>
<script src="gioco.js"></script>
<!--FINE-->
</body>
</html>
